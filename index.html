<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Moda danes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg"></div>

<div id="app">
  <header id="topbar">
    <div class="tb-row">
      <button id="brand" class="brand" aria-label="Podjetja"><span id="site-name">Moda danes</span><span class="caret">▾</span></button>
      <span id="counter" class="counter"></span>
      <div class="tb-actions">
        <button id="btn-lang" class="lang-btn" aria-label="Jezik"><span data-l="sl">SL</span>/<span data-l="en">EN</span></button>
        <button id="btn-cart" class="icon-btn" aria-label="Košarica"><span id="ic-cart"></span><span id="cart-badge" class="badge" hidden>0</span></button>
        <button id="btn-admin" class="icon-btn" aria-label="Admin"><span id="ic-admin"></span><i id="admin-dot" class="dot" hidden></i></button>
      </div>
    </div>
    <nav id="tabs" class="tabs" aria-label="Podjetja"></nav>
    <nav id="sections" class="tabs sub" hidden></nav>
    <nav id="ages" class="tabs sub" hidden></nav>
  </header>

  <main id="feed" tabindex="-1"></main>

  <div id="hint" class="hint" hidden>
    <div><b>↕</b> <span data-i18n>naslednji izdelek</span></div>
    <div><b>↔</b> <span data-i18n>druga znamka</span></div>
  </div>
</div>

<div class="desk-nav" aria-hidden="true">
  <button id="nav-left" title="Prejšnja znamka">‹</button>
  <button id="nav-up" title="Prejšnji izdelek">⌃</button>
  <button id="nav-down" title="Naslednji izdelek">⌄</button>
  <button id="nav-right" title="Naslednja znamka">›</button>
</div>

<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
